<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accrual Workbench</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fbfcfd; --border:#e4e8ee;
    --text:#1b2430; --muted:#69747f; --accent:#1f7a3d; --accent-2:#2a9d54;
    --accent-soft:#e8f4ec; --danger:#c0392b; --danger-soft:#fbeae8; --warn:#b7791f;
    --warn-soft:#fdf3e2; --info:#2b6cb0; --info-soft:#e8f0fa; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
    --radius:12px; --radius-sm:8px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1418; --panel:#161c22; --panel-2:#1b232b; --border:#28323c;
      --text:#e6ebf0; --muted:#94a1ad; --accent:#3fbf6b; --accent-2:#35a95c;
      --accent-soft:#12301d; --danger:#f0736a; --danger-soft:#3a1d1a; --warn:#e0b25a;
      --warn-soft:#332711; --info:#63a4e0; --info-soft:#14232f; --shadow:0 1px 2px rgba(0,0,0,.3);}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent);text-decoration:none}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .side{width:216px;flex:0 0 216px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:700;font-size:15px}
  .brand .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:13px;font-weight:800}
  .nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);
    color:var(--muted);font-weight:500;transition:.12s}
  .nav a:hover{background:var(--panel-2);color:var(--text)}
  .nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav a .ic{width:16px;text-align:center}
  .side .foot{margin-top:auto;padding:14px 18px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--border);
    background:var(--panel);position:sticky;top:0;z-index:5}
  .top h1{font-size:18px;margin:0;font-weight:650}
  .top .sp{flex:1}
  .content{padding:22px 24px;max-width:1200px;width:100%}
  /* Buttons */
  .btn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);
    padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--panel-2);color:var(--text)}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  /* Cards / tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .tile .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tile .v{font-size:26px;font-weight:700;margin:6px 0 2px}
  .tile .s{font-size:12px;color:var(--muted)}
  .tile.accent .v{color:var(--accent)} .tile.danger .v{color:var(--danger)} .tile.warn .v{color:var(--warn)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card .hd{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:650;display:flex;align-items:center;gap:10px}
  .card .hd .sp{flex:1}
  .card .bd{padding:4px 0}
  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);
    font-weight:600;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  /* Pills */
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
  .pill.gray{background:var(--panel-2);color:var(--muted);border:1px solid var(--border)}
  .pill.green{background:var(--accent-soft);color:var(--accent)}
  .pill.blue{background:var(--info-soft);color:var(--info)}
  .pill.amber{background:var(--warn-soft);color:var(--warn)}
  .pill.red{background:var(--danger-soft);color:var(--danger)}
  /* Filters */
  select,input,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:7px 10px}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  /* Checkbox cell */
  .chk{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  /* Rollforward bars */
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:16px 18px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .bar .col{width:60%;border-radius:6px 6px 0 0;background:var(--accent);transition:.3s}
  .bar .lb{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(12,18,24,.5);display:none;align-items:flex-start;
    justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;
    max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal .hd{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px;display:flex;align-items:center}
  .modal .bd{padding:18px 20px;max-height:65vh;overflow:auto}
  .modal .ft{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:2px}
  .fld label{font-size:12px;font-weight:600;color:var(--muted)}
  .fld .hint{font-size:11px;color:var(--muted)}
  .fld input,.fld select,.fld textarea{width:100%}
  .full{grid-column:1/-1}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    font-weight:700;margin:14px 0 4px;grid-column:1/-1}
  /* typeahead */
  .ta{position:relative}
  .ta .menu{position:absolute;left:0;right:0;top:calc(100% + 2px);background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:10;max-height:200px;overflow:auto;display:none}
  .ta .menu.on{display:block}
  .ta .menu div{padding:8px 10px;cursor:pointer}
  .ta .menu div:hover{background:var(--accent-soft);color:var(--accent)}
  /* Toast */
  .toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:100}
  .toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);
    border-radius:var(--radius-sm);padding:12px 16px;box-shadow:0 6px 20px rgba(0,0,0,.15);min-width:240px;
    animation:slide .2s ease}
  .toast.err{border-left-color:var(--danger)} .toast.warn{border-left-color:var(--warn)}
  @keyframes slide{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .subnav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .subnav button{border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:6px 12px;
    border-radius:999px;font-size:12px;font-weight:600;cursor:pointer}
  .subnav button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
  @media(max-width:820px){.side{display:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">AE</span> Accrual Engine</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="whoami">&nbsp;</div>
  </aside>
  <div class="main">
    <div class="top"><h1 id="viewTitle">Dashboard</h1><div class="sp"></div>
      <div id="topFilters" class="filters"></div>
      <button class="btn ghost" onclick="AE.reload()" title="Refresh">↻</button>
    </div>
    <div class="content" id="main"><div class="spinner"></div></div>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
  "use strict";
  var URL = "{{AE_URL}}";
  var BOOT = null, STATE = { view:"dashboard", filters:{}, bucket:"due", groupby:"period", sel:{} };

  var VIEWS = [
    {id:"dashboard", label:"Dashboard", ic:"◧"},
    {id:"rules", label:"Accrual Rules", ic:"▤"},
    {id:"current", label:"Current Period", ic:"◑"},
    {id:"matching", label:"Bill Matching", ic:"⇄"},
    {id:"reversals", label:"Reversals", ic:"↺"},
    {id:"exceptions", label:"Exceptions", ic:"!"},
    {id:"rollforward", label:"Rollforward", ic:"∑"}
  ];

  /* ---------- net ---------- */
  function get(api, params){
    var qs = Object.keys(params||{}).filter(function(k){return params[k]!=null&&params[k]!==""})
      .map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k])}).join("&");
    return fetch(URL+"&api="+api+(qs?"&"+qs:""),{credentials:"same-origin"})
      .then(function(r){return r.json()});
  }
  function post(body){
    return fetch(URL,{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json()});
  }

  /* ---------- ui helpers ---------- */
  function el(id){return document.getElementById(id)}
  function h(html){var d=document.createElement("div");d.innerHTML=html;return d.firstElementChild}
  function money(v){var n=Number(v||0);return (n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function num(v){return v==null||v===""?"":Number(v).toLocaleString("en-US")}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
  function pretty(s){return String(s||"").replace(/_/g," ").replace(/\b\w/g,function(c){return c.toUpperCase()})}
  function toast(msg,type){var t=h('<div class="toast '+(type||"")+'">'+esc(msg)+'</div>');el("toasts").appendChild(t);
    setTimeout(function(){t.style.opacity=0;setTimeout(function(){t.remove()},250)},3200)}
  function spin(){el("main").innerHTML='<div class="spinner"></div>'}
  var STAT={draft:"gray",calculated:"blue",posted:"green",partially_matched:"amber",matched_to_bill:"green",
    converted_to_bill:"green",reversed:"gray",reaccrued:"blue",closed:"gray",exception:"red",
    pending:"amber",reversed_:"gray",failed:"red",cancelled:"gray",not_required:"gray"};
  function pill(s){var c=STAT[s]||"gray";return '<span class="pill '+c+'">'+esc(pretty(s))+'</span>'}

  /* ---------- nav ---------- */
  function renderNav(){
    el("nav").innerHTML = VIEWS.map(function(v){
      return '<a href="#'+v.id+'" class="'+(STATE.view===v.id?"active":"")+'"><span class="ic">'+v.ic+'</span>'+v.label+'</a>';
    }).join("");
  }

  /* ---------- router ---------- */
  function route(){
    var v = (location.hash||"#dashboard").slice(1) || "dashboard";
    if(!VIEWS.some(function(x){return x.id===v})) v="dashboard";
    STATE.view=v; STATE.sel={};
    el("viewTitle").textContent = (VIEWS.filter(function(x){return x.id===v})[0]||{}).label;
    renderNav(); el("topFilters").innerHTML="";
    ({dashboard:vDashboard,rules:vRules,current:vCurrent,matching:vMatching,
      reversals:vReversals,exceptions:vExceptions,rollforward:vRollforward}[v])();
  }
  window.AE={ reload:route };

  /* ---------- dashboard ---------- */
  function vDashboard(){
    spin();
    get("dashboard",{}).then(function(r){
      if(!r.ok) return fail(r);
      var t=r.data.tiles;
      var tiles=[
        tile("Total Accrual Liability",money(t.posted),t.postedCount+" posted","accent"),
        tile("Pending (Not Posted)",money(t.pending),t.pendingCount+" schedules",""),
        tile("Reversals Due",t.reversalsDue,"on/before today","warn"),
        tile("Open / Unmatched",t.unmatched,"awaiting a bill",""),
        tile("Exceptions",t.exceptions,"need attention","danger")
      ].join("");
      el("main").innerHTML =
        '<div class="tiles">'+tiles+'</div>'+
        '<div class="card"><div class="hd">Liability Rollforward by Period</div>'+
        barsHtml(r.data.rollforward)+ rollTable(r.data.rollforward)+'</div>';
    }).catch(neterr);
  }
  function tile(k,v,s,cls){return '<div class="tile '+cls+'"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+
    '</div><div class="s">'+esc(s)+'</div></div>'}
  function barsHtml(rows){
    if(!rows.length) return "";
    var max=Math.max.apply(null,rows.map(function(r){return Math.abs(r.ending)}).concat([1]));
    return '<div class="bars">'+rows.slice(-10).map(function(r){
      var hpx=Math.max(4,Math.round(Math.abs(r.ending)/max*110));
      return '<div class="bar"><div class="col" style="height:'+hpx+'px" title="'+esc(money(r.ending))+'"></div>'+
        '<div class="lb">'+esc(r.group||"")+'</div></div>';
    }).join("")+'</div>';
  }
  function rollTable(rows){
    if(!rows.length) return '<div class="empty">No accrual activity yet.</div>';
    return '<table><thead><tr><th>Group</th><th class="num">Beginning</th><th class="num">New</th>'+
      '<th class="num">Reversals</th><th class="num">Bills</th><th class="num">Ending</th></tr></thead><tbody>'+
      rows.map(function(r){return '<tr><td>'+esc(r.group||"—")+'</td><td class="num">'+money(r.beginning)+
        '</td><td class="num">'+money(r.newAccruals)+'</td><td class="num">('+money(r.reversals)+')</td>'+
        '<td class="num">('+money(r.billsApplied)+')</td><td class="num"><b>'+money(r.ending)+'</b></td></tr>'}).join("")+
      '</tbody></table>';
  }

  /* ---------- rules ---------- */
  function vRules(){
    spin();
    el("topFilters").innerHTML='';
    get("rules",{}).then(function(r){
      if(!r.ok) return fail(r);
      var rows=r.data;
      var head='<div class="toolbar"><button class="btn primary" onclick="AE.newRule()">+ New Rule</button></div>';
      var body = !rows.length ? '<div class="empty">No accrual rules yet. Click <b>New Rule</b> to create one.</div>' :
        '<table><thead><tr><th>Rule</th><th>Type</th><th>Vendor</th><th>Location</th><th>Frequency</th><th>Status</th><th></th></tr></thead><tbody>'+
        rows.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(pretty(x.calc_type))+'</td>'+
          '<td>'+esc(x.vendor||"—")+'</td><td>'+esc(x.location||"—")+'</td><td>'+esc(pretty(x.frequency))+'</td>'+
          '<td>'+(isT(x.inactive)?'<span class="pill gray">Inactive</span>':'<span class="pill green">Active</span>')+'</td>'+
          '<td><button class="btn sm" onclick="AE.editRule('+x.id+')">Edit</button></td></tr>'}).join("")+'</tbody></table>';
      el("main").innerHTML = head + '<div class="card">'+body+'</div>';
    }).catch(neterr);
  }
  function isT(v){return String(v).toUpperCase()==="T"||String(v).toUpperCase()==="TRUE"}

  window.AE.newRule=function(){openRuleModal(null)};
  window.AE.editRule=function(id){ get("rule",{id:id}).then(function(r){ if(r.ok) openRuleModal(r.data); else fail(r)})};

  function openRuleModal(rule){
    rule=rule||{};
    var en=BOOT.enums, rf=BOOT.refs;
    function sel(name,opts,val,textVal){
      return '<select name="'+name+'"><option value="">—</option>'+opts.map(function(o){
        var v=o.value!==undefined?o.value:o.id, l=o.label!==undefined?o.label:o.name;
        var cur = textVal!=null ? String(l)===String(textVal) : String(v)===String(val==null?"":val);
        return '<option value="'+esc(v)+'"'+(cur?" selected":"")+'>'+esc(l)+'</option>'}).join("")+'</select>';
    }
    function inp(name,val,type){return '<input name="'+name+'" type="'+(type||"text")+'" value="'+esc(val==null?"":val)+'">'}
    var body =
      '<div class="grid2">'+
      fld("Name","full",inp("name",rule.name))+
      '<div class="section-title">Calculation</div>'+
      fld("Calculation Type","",sel("calcType",en.calcType,null,pretty(rule.calcType)))+
      fld("Frequency","",sel("frequency",en.frequency,null,pretty(rule.frequency)))+
      fld("Fixed Amount","",inp("fixedAmount",rule.fixedAmount,"number"))+
      fld("Rate","",inp("rate",rule.rate,"number"))+
      fld("Rate Source","",sel("rateSource",en.rateSource,null,pretty(rule.rateSource)))+
      fld("Manual Quantity","",inp("manualQty",rule.manualQty,"number"))+
      fld("Percentage (%)","",inp("percentage",rule.percentage,"number"))+
      fld("Percent Basis","",inp("percentBasis",rule.percentBasis,"number"))+
      fld("Quantity Saved Search ID","full",inp("savedSearch",rule.savedSearch))+
      '<div class="section-title">Dimensions</div>'+
      fld("Subsidiary","",sel("subsidiary",rf.subsidiary,rule.subsidiary))+
      fld("Location","",sel("location",rf.location,rule.location))+
      fld("Vendor","",typeahead("vendor",rule.vendor))+
      fld("Item","",typeahead("item",rule.item))+
      fld("Accrual Account","",sel("accrualAccount",rf.account,rule.accrualAccount))+
      fld("Expense/COGS Account","",sel("expenseAccount",rf.account,rule.expenseAccount))+
      fld("Journal Category","",sel("journalCategory",rf.journalCategory,rule.journalCategory))+
      '<div class="section-title">Reversal &amp; Bill Behavior</div>'+
      fld("Reversal Method","",sel("reversalMethod",en.reversalMethod,null,pretty(rule.reversalMethod)))+
      fld("Reversal Date Rule","",sel("reversalDateRule",en.reversalDateRule,null,pretty(rule.reversalDateRule)))+
      fld("Bill Behavior","",sel("billBehavior",en.billBehavior,null,pretty(rule.billBehavior)))+
      fld("Lookback Months","",inp("lookbackMonths",rule.lookbackMonths,"number"))+
      fld("Start Date","",inp("startDate",fmtDate(rule.startDate),"date"))+
      fld("End Date","",inp("endDate",fmtDate(rule.endDate),"date"))+
      fld("Memo Template","full",inp("memoTemplate",rule.memoTemplate))+
      '</div>';
    showModal((rule.id?"Edit":"New")+" Accrual Rule", body,
      '<button class="btn ghost" onclick="AE.closeModal()">Cancel</button>'+
      '<button class="btn primary" onclick="AE.saveRule('+(rule.id||"null")+')">Save Rule</button>');
    wireTypeaheads();
  }
  function fld(label,cls,inner){return '<div class="fld '+cls+'"><label>'+esc(label)+'</label>'+inner+'</div>'}
  function fmtDate(d){ if(!d) return ""; var m=/(\d{4})-(\d{2})-(\d{2})/.exec(d); if(m) return m[0];
    var dt=new Date(d); if(isNaN(dt))return""; return dt.toISOString().slice(0,10)}

  window.AE.saveRule=function(id){
    var m=el("modal"); var data={}; if(id) data.id=id;
    m.querySelectorAll("[name]").forEach(function(f){ if(f.value!=="") data[f.name]=f.value; });
    // typeahead hidden ids
    m.querySelectorAll("input[data-ta-id]").forEach(function(f){ if(f.getAttribute("data-ta-id")) data[f.name]=f.getAttribute("data-ta-id"); });
    var btn=m.querySelector(".btn.primary"); btn.disabled=true; btn.textContent="Saving…";
    post({action:"saveRule",rule:data}).then(function(r){
      if(r.ok){ toast("Rule saved."); closeModal(); if(STATE.view==="rules") vRules(); }
      else { toast(r.error||"Save failed","err"); btn.disabled=false; btn.textContent="Save Rule"; }
    }).catch(function(){toast("Network error","err");btn.disabled=false;btn.textContent="Save Rule"});
  };

  /* typeahead */
  function typeahead(type,val){
    return '<div class="ta"><input name="'+type+'" data-ta="'+type+'" data-ta-id="'+(val||"")+
      '" value="'+esc(val?("#"+val):"")+'" placeholder="type to search…" autocomplete="off">'+
      '<div class="menu"></div></div>';
  }
  function wireTypeaheads(){
    el("modal").querySelectorAll("input[data-ta]").forEach(function(inp){
      var menu=inp.nextElementSibling, type=inp.getAttribute("data-ta"), timer;
      inp.addEventListener("input",function(){
        inp.setAttribute("data-ta-id","");
        clearTimeout(timer); var q=inp.value.trim();
        if(q.length<2){menu.classList.remove("on");return}
        timer=setTimeout(function(){
          get("lookup",{type:type,q:q}).then(function(r){
            if(!r.ok||!r.data.length){menu.classList.remove("on");menu.innerHTML="";return}
            menu.innerHTML=r.data.map(function(o){return '<div data-id="'+o.id+'">'+esc(o.name)+'</div>'}).join("");
            menu.classList.add("on");
            menu.querySelectorAll("div").forEach(function(d){d.onclick=function(){
              inp.value=d.textContent; inp.setAttribute("data-ta-id",d.getAttribute("data-id")); menu.classList.remove("on")}});
          });
        },220);
      });
      document.addEventListener("click",function(e){if(!inp.parentElement.contains(e.target))menu.classList.remove("on")});
    });
  }

  /* ---------- current period ---------- */
  function vCurrent(){
    renderFilters(["period","location","status"]);
    spin();
    get("schedules",STATE.filters).then(function(r){
      if(!r.ok) return fail(r);
      var acts='<div class="toolbar">'+
        actBtn("calculate","Calculate")+actBtn("post","Post",'primary')+actBtn("reverse","Reverse")+
        actBtn("reverse_reaccrue","Reverse &amp; Reaccrue")+actBtn("convert","Convert to Bill")+'</div>';
      el("main").innerHTML = acts + '<div class="card">'+schedTable(r.data,true)+'</div>';
      wireSel();
    }).catch(neterr);
  }
  function actBtn(a,label,cls){return '<button class="btn '+(cls||"")+'" onclick="AE.act(\''+a+'\')">'+label+'</button>'}
  function schedTable(rows,sel){
    if(!rows.length) return '<div class="empty">No schedules for this filter. Generate them from the Schedule Generator, or create a rule first.</div>';
    return '<table><thead><tr>'+(sel?'<th></th>':'')+'<th>Rule</th><th>Vendor</th><th>Period</th>'+
      '<th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th><th>Status</th><th>Reversal</th></tr></thead><tbody>'+
      rows.map(function(x){var amt=x.override_amount!=null&&x.override_amount!==""?x.override_amount:x.amount;
        return '<tr>'+(sel?'<td><input type="checkbox" class="chk" value="'+x.id+'"></td>':'')+
        '<td><b>'+esc(x.rulename)+'</b></td><td>'+esc(x.vendor||"—")+'</td><td>'+esc(x.period||"—")+'</td>'+
        '<td class="num">'+num(x.qty)+'</td><td class="num">'+num(x.rate)+'</td><td class="num">'+money(amt)+'</td>'+
        '<td>'+pill(x.status)+'</td><td>'+esc(x.reversal_date||"")+'</td></tr>'}).join("")+'</tbody></table>';
  }
  function wireSel(){
    el("main").querySelectorAll(".chk").forEach(function(c){c.addEventListener("change",function(){
      if(c.checked)STATE.sel[c.value]=1;else delete STATE.sel[c.value]})});
  }
  window.AE.act=function(a){
    var ids=Object.keys(STATE.sel);
    if(!ids.length){toast("Select at least one row.","warn");return}
    if((a==="reverse"||a==="convert"||a==="reverse_reaccrue")&&!confirm("Confirm "+pretty(a)+" for "+ids.length+" schedule(s)?"))return;
    post({action:a,ids:ids}).then(function(r){
      if(!r.ok)return toast(r.error||"Failed","err");
      var ok=r.results.filter(function(x){return x.ok!==false}).length, bad=r.results.length-ok;
      toast(pretty(a)+": "+ok+" ok"+(bad?", "+bad+" failed":""),bad?"warn":"");
      STATE.sel={}; route();
    }).catch(function(){toast("Network error","err")});
  };

  /* ---------- matching ---------- */
  function vMatching(){
    renderFilters(["vendor","location"]);
    spin();
    get("matching",STATE.filters).then(function(r){
      if(!r.ok)return fail(r);
      var rows=r.data;
      var body = !rows.length ? '<div class="empty">No open accruals to match.</div>' :
        '<table><thead><tr><th>Rule</th><th>Vendor</th><th>Period</th><th class="num">Accrued</th><th class="num">Last Variance</th><th></th></tr></thead><tbody>'+
        rows.map(function(x){var amt=x.override_amount!=null&&x.override_amount!==""?x.override_amount:x.amount;
          return '<tr><td><b>'+esc(x.rulename)+'</b></td><td>'+esc(x.vendor||"—")+'</td><td>'+esc(x.period||"")+'</td>'+
          '<td class="num">'+money(amt)+'</td><td class="num">'+(x.variance?money(x.variance):"—")+'</td>'+
          '<td><button class="btn sm primary" onclick="AE.matchModal('+x.id+','+(amt||0)+',\''+esc(x.rulename)+'\')">Match Bill</button></td></tr>'}).join("")+'</tbody></table>';
      el("main").innerHTML='<div class="card">'+body+'</div>';
    }).catch(neterr);
  }
  window.AE.matchModal=function(id,accrued,name){
    var body='<div class="grid2">'+
      fld("Accrued Amount","full",'<input value="'+money(accrued)+'" disabled>')+
      fld("Vendor Bill (internal id)","",'<input id="mBill" placeholder="e.g. 10482">')+
      fld("Bill Amount","",'<input id="mAmt" type="number" value="'+accrued+'">')+
      fld("Partial match?","full",'<label style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="mPartial" class="chk"> keep accrual open for the remainder</label>')+
      '</div>';
    showModal("Match Bill — "+name, body,
      '<button class="btn ghost" onclick="AE.closeModal()">Cancel</button>'+
      '<button class="btn primary" onclick="AE.doMatch('+id+')">Match</button>');
  };
  window.AE.doMatch=function(id){
    var bill=el("mBill").value.trim(), amt=el("mAmt").value, partial=el("mPartial").checked;
    if(!bill){toast("Enter a bill internal id","warn");return}
    post({action:"match",scheduleId:id,billId:bill,amount:Number(amt),partial:partial}).then(function(r){
      if(r.ok){toast("Matched. Variance "+money(r.result.variance));closeModal();vMatching()}
      else toast(r.error||"Match failed","err");
    }).catch(function(){toast("Network error","err")});
  };

  /* ---------- reversals ---------- */
  function vReversals(){
    var buckets=[["due","Due / Overdue"],["future","Future"],["failed","Failed"],["reversed","Reversed"],["missing","Missing Date"]];
    el("main").innerHTML='<div class="subnav">'+buckets.map(function(b){
      return '<button class="'+(STATE.bucket===b[0]?"active":"")+'" onclick="AE.bucket(\''+b[0]+'\')">'+b[1]+'</button>'}).join("")+
      '</div><div class="toolbar">'+actBtn("reverse","Create Reversal",'primary')+'</div><div id="revList"><div class="spinner"></div></div>';
    get("reversals",{bucket:STATE.bucket}).then(function(r){
      if(!r.ok)return fail(r);
      var rows=r.data;
      el("revList").innerHTML='<div class="card">'+(!rows.length?'<div class="empty">Nothing here.</div>':
        '<table><thead><tr><th></th><th>Rule</th><th class="num">Amount</th><th>Reversal Date</th><th>Status</th><th>Reason</th></tr></thead><tbody>'+
        rows.map(function(x){return '<tr><td><input type="checkbox" class="chk" value="'+x.id+'"></td>'+
          '<td><b>'+esc(x.rulename)+'</b></td><td class="num">'+money(x.amount)+'</td><td>'+esc(x.reversal_date||"")+'</td>'+
          '<td>'+pill(x.reversal_status)+'</td><td>'+esc(x.reason||"")+'</td></tr>'}).join("")+'</tbody></table>')+'</div>';
      wireSel();
    }).catch(neterr);
  }
  window.AE.bucket=function(b){STATE.bucket=b;STATE.sel={};vReversals()};

  /* ---------- exceptions ---------- */
  function vExceptions(){
    spin();
    get("exceptions",{}).then(function(r){
      if(!r.ok)return fail(r);
      var rows=r.data;
      el("main").innerHTML='<div class="card">'+(!rows.length?'<div class="empty">🎉 No exceptions.</div>':
        '<table><thead><tr><th>Rule</th><th>Period</th><th>Exception</th></tr></thead><tbody>'+
        rows.map(function(x){return '<tr><td><b>'+esc(x.rulename)+'</b></td><td>'+esc(x.period||"")+'</td>'+
          '<td><span class="pill red">'+esc(x.reason||"")+'</span></td></tr>'}).join("")+'</tbody></table>')+'</div>';
    }).catch(neterr);
  }

  /* ---------- rollforward ---------- */
  function vRollforward(){
    el("topFilters").innerHTML='<label>Group by <select id="rfGrp">'+
      [["period","Period"],["vendor","Vendor"],["location","Location"],["rule","Rule"]].map(function(g){
        return '<option value="'+g[0]+'"'+(STATE.groupby===g[0]?" selected":"")+'>'+g[1]+'</option>'}).join("")+'</select></label>';
    el("rfGrp").onchange=function(){STATE.groupby=this.value;vRollforward()};
    spin();
    get("rollforward",{groupby:STATE.groupby}).then(function(r){
      if(!r.ok)return fail(r);
      el("main").innerHTML='<div class="card"><div class="hd">Liability Rollforward by '+pretty(STATE.groupby)+
        '<div class="sp"></div><button class="btn sm" onclick="AE.exportRoll()">Export CSV</button></div>'+
        rollTable(r.data)+'</div>';
      STATE._roll=r.data;
    }).catch(neterr);
  }
  window.AE.exportRoll=function(){
    var rows=STATE._roll||[]; var csv="Group,Beginning,New Accruals,Reversals,Bills Applied,Ending\n"+
      rows.map(function(r){return [r.group,r.beginning,r.newAccruals,r.reversals,r.billsApplied,r.ending].join(",")}).join("\n");
    var a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download="accrual_rollforward.csv";a.click();
  };

  /* ---------- filters ---------- */
  function renderFilters(which){
    var b=BOOT;
    var html=which.map(function(f){
      if(f==="period") return flt("period","Period",b.periods,"id","name");
      if(f==="location") return flt("location","Location",b.refs.location,"id","name");
      if(f==="status") return '<label>Status<select data-flt="status"><option value="">All</option>'+
        statusOpts()+'</select></label>';
      if(f==="vendor") return '<label>Vendor<input data-flt="vendor" placeholder="vendor id"></label>';
      return "";
    }).join("");
    el("topFilters").innerHTML=html;
    el("topFilters").querySelectorAll("[data-flt]").forEach(function(s){
      s.value=STATE.filters[s.getAttribute("data-flt")]||"";
      s.addEventListener("change",function(){STATE.filters[s.getAttribute("data-flt")]=s.value;route()});
    });
  }
  function statusOpts(){var S=["draft","calculated","posted","partially_matched","matched_to_bill","reversed","exception"];
    return S.map(function(s){return '<option value="'+s+'">'+pretty(s)+'</option>'}).join("")}
  function flt(key,label,opts,vk,lk){return '<label>'+label+'<select data-flt="'+key+'"><option value="">All</option>'+
    (opts||[]).map(function(o){return '<option value="'+esc(o[vk])+'">'+esc(o[lk])+'</option>'}).join("")+'</select></label>'}

  /* ---------- modal ---------- */
  function showModal(title,body,footer){
    el("modal").innerHTML='<div class="hd">'+esc(title)+'</div><div class="bd">'+body+'</div><div class="ft">'+footer+'</div>';
    el("overlay").classList.add("on");
  }
  function closeModal(){el("overlay").classList.remove("on")}
  window.AE.closeModal=closeModal;
  el("overlay").addEventListener("click",function(e){if(e.target===el("overlay"))closeModal()});

  /* ---------- errors ---------- */
  function fail(r){el("main").innerHTML='<div class="empty">'+esc(r.error||"Error loading data")+'</div>'}
  function neterr(e){el("main").innerHTML='<div class="empty">Network error. '+esc((e&&e.message)||"")+'</div>'}

  /* ---------- boot ---------- */
  spin();
  get("bootstrap",{}).then(function(r){
    if(!r.ok){el("main").innerHTML='<div class="empty">Could not initialize: '+esc(r.error||"")+'</div>';return}
    BOOT=r.data;
    el("whoami").textContent = BOOT.user ? BOOT.user.name : "";
    window.addEventListener("hashchange",route);
    route();
  }).catch(function(e){el("main").innerHTML='<div class="empty">Could not reach the server. '+esc((e&&e.message)||"")+'</div>'});
})();
</script>
</body>
</html>
